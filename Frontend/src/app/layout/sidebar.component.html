<div class="marque">
  <span class="logo"><app-icon nom="logo" [taille]="16" /></span>
  <span>LaunchPad AI</span>
</div>

<!-- Le nom du projet viendra du service des projets : seul l'identifiant est connu pour l'instant -->
<button type="button" class="projet" title="Changement de projet bientôt disponible">
  <span class="initiale">P</span>
  <span class="textes">
    <span class="nom">Projet n°{{ utilisateur.projetId }}</span>
    <span class="sous-titre">Mon projet startup</span>
  </span>
  <app-icon nom="selecteur" [taille]="14" />
</button>

<nav aria-label="Navigation principale">
  <span class="rubrique">MON ESPACE</span>
  @for (lien of liens; track lien.route) {
    <a [routerLink]="lien.route" routerLinkActive="actif" ariaCurrentWhenActive="page">
      <app-icon [nom]="lien.icone" />{{ lien.libelle }}
    </a>
  }
</nav>

<div class="espaceur"></div>

<div class="encart">
  <span class="titre">Un cap, à chaque étape.</span>
  <span class="texte">Votre Co-Fondateur IA vous aide à structurer votre projet.</span>
  <a routerLink="/co-fondateur-ia">Échanger avec mon IA →</a>
</div>

<div class="compte">
  <span class="avatar">E</span>
  <span class="textes">
    <span class="nom">Entrepreneur</span>
    <span class="sous-titre">Compte n°{{ utilisateur.entrepreneurId }}</span>
  </span>
</div>
