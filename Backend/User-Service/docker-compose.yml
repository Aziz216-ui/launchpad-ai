# docker-compose du User-Service LaunchPad AI (Django + Keycloak).
# Lancement : docker compose up -d --build
#
# Eureka (Backend/Eureka, port 8761) et l'API Gateway (port 8090) tournent sur
# la machine hôte : ce compose publie le service Django sur l'hôte
# (USER_SERVICE_PORT, défaut 8001) pour qu'ils puissent le joindre.
#
# Ports hôte par défaut (surchargeables) :
#   USER_DB_PORT      (5439)  Postgres "launchpad"
#   KEYCLOAK_PORT     (8180)  Keycloak (8080 déjà documenté comme pris par l'API Gateway)
#   USER_SERVICE_PORT (8001)  API Django
# La base keycloak_db n'est pas exposée à l'hôte : seul le conteneur Keycloak s'y connecte.
#
# Secrets : voir .env.example (copier en .env, ne jamais committer .env).

services:
  user-db:
    image: postgres:16-alpine
    container_name: user-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-launchpad}
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345678}
    ports:
      - "${USER_DB_PORT:-5439}:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - user-service-net

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - user-service-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: user-service-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD manquant, copier .env.example en .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 2 cat <&3 | grep -m 1 -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - user-service-net

  keycloak-init:
    build: .
    container_name: user-service-keycloak-init
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080/
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD manquant, copier .env.example en .env}
    entrypoint: ["python", "setup_keycloak.py"]
    networks:
      - user-service-net

  user-service:
    build: .
    container_name: user-service
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY manquant, copier .env.example en .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,host.docker.internal}
      PORT: ${USER_SERVICE_PORT:-8001}
      DB_NAME: ${DB_NAME:-launchpad}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-12345678}
      DB_HOST: user-db
      DB_PORT: "5432"
      KEYCLOAK_SERVER_URL: http://keycloak:8080/
      KEYCLOAK_REALM: launchpad
      KEYCLOAK_CLIENT_ID: launchpad-client
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET manquant, copier .env.example en .env}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD manquant, copier .env.example en .env}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://host.docker.internal:8761/eureka}
      EUREKA_INSTANCE_HOST: ${EUREKA_INSTANCE_HOST:-localhost}
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
    ports:
      - "${USER_SERVICE_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # nécessaire sous Linux, sans effet sous Docker Desktop
    networks:
      - user-service-net

networks:
  user-service-net:
    driver: bridge

volumes:
  user_db_data:
  keycloak_db_data:
