# Port hôte de legal-postgres surchargeable via LEGAL_DB_PORT (défaut 5446, déplacé de
# 5432 pour ne pas entrer en collision avec la base "legacy" du docker-compose.yml racine).
services:
  legal-postgres:
    image: postgres:16-alpine
    container_name: launchpad-legal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: legal_db
    ports:
      - "${LEGAL_DB_PORT:-5446}:5432"
    volumes:
      - legal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  legal-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: launchpad-legal-service
    restart: unless-stopped
    depends_on:
      legal-postgres:
        condition: service_healthy
    environment:
      PORT: 3003
      NODE_ENV: production
      GLOBAL_PREFIX: api/legal
      DB_HOST: legal-postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: legal_db
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      EUREKA_ENABLED: "true"
      EUREKA_HOST: host.docker.internal
      EUREKA_PORT: 8761
      EUREKA_APP_NAME: LEGAL-SERVICE
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672
      RABBITMQ_EXCHANGE: launchpad.events
      CLAUSE_SERVICE_URL: http://host.docker.internal:3004/api/clauses
      COMMENTAIRE_SERVICE_URL: http://host.docker.internal:3005/api/commentaires
    ports:
      - "3003:3003"

volumes:
  legal_pgdata:
    driver: local
