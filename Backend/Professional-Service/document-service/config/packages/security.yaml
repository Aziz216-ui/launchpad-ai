security:
    providers:
        # Les utilisateurs ne sont pas stockés : ils sont construits à partir des claims du JWT Keycloak
        keycloak:
            id: Launchpad\Common\Security\KeycloakUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        # Routes publiques : santé, métriques Prometheus et documentation (Swagger UI + spécification OpenAPI)
        public:
            pattern: ^/api/comptable/(health|metrics|docs|docs\.json)$
            security: false
        # Appels entre microservices : clé partagée vérifiée par InternalApiKeyListener (module commun)
        internal:
            pattern: ^/internal/
            security: false
        api:
            pattern: ^/api/comptable
            stateless: true
            provider: keycloak
            entry_point: Launchpad\Common\Security\JsonAuthenticationEntryPoint
            access_token:
                # Authorization: Bearer <JWT émis par Keycloak, envoyé par le frontend>
                token_handler:
                    oidc:
                        claim: sub
                        audience: '%env(KEYCLOAK_AUDIENCE)%'
                        issuers: ['%env(KEYCLOAK_ISSUER)%']
                        algorithms: ['RS256']
                        # Clés publiques récupérées via /.well-known/openid-configuration (JWKS), mises en cache
                        discovery:
                            base_uri: '%env(KEYCLOAK_ISSUER)%/'
                            cache:
                                id: cache.app
                failure_handler: Launchpad\Common\Security\JsonAuthenticationFailureHandler

    # Toute route de l'API exige l'un des rôles métier ; le détail est géré par les Voters
    access_control:
        - { path: ^/api/comptable, roles: [ROLE_ACCOUNTANT, ROLE_ENTREPRENEUR, ROLE_ADMIN] }
