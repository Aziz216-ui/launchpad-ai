spring:
  application:
    name: document-service
  cloud:
    openfeign:
      client:
        config:
          # Timeouts par client Feign (ms) : court pour les données de prévision, long pour l'analyse IA (LLM)
          prevision:
            connect-timeout: 5000
            read-timeout: 5000
          prevision-analyse:
            connect-timeout: 5000
            read-timeout: 45000
  profiles:
    default: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clés publiques du realm Keycloak (utilisées seulement si finance.securite.active=true)
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/launchpad/protocol/openid-connect/certs}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/document_db}
    username: ${DB_USERNAME:document}
    password: ${DB_PASSWORD:document}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Broker éteint : la publication échoue vite au lieu de bloquer la requête (le document reste valide).
    connection-timeout: 3s
    listener:
      simple:
        # Message en échec : 3 tentatives puis rejet sans remise en file (évite une boucle infinie).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

server:
  port: ${SERVER_PORT:8083}
  # Derrière l'API Gateway : les URL construites (en-tête Location) reprennent l'adresse publique
  # transmise par la passerelle (X-Forwarded-Host / -Port / -Proto), et non localhost:8083.
  forward-headers-strategy: framework

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    # Adresse annoncée aux autres services (même convention que l'API Gateway) : localhost en local,
    # host.docker.internal en conteneur (voir docker-compose.yml). L'IP détectée automatiquement peut être celle
    # d'une carte réseau virtuelle (VMware, Hyper-V…) injoignable depuis les autres services.
    hostname: ${EUREKA_INSTANCE_HOST:localhost}
    prefer-ip-address: false
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${server.port}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

finance:
  # Sécurité : mêmes valeurs que l'API Gateway. false = tout ouvert (développement sans Keycloak).
  securite:
    active: ${JWT_ENABLED:false}
  # Prevision-Service : résolu par son nom dans Eureka (Feign + LoadBalancer).
  # URL facultative : si renseignée, remplace Eureka (tests, exécution sans registre).
  prevision-service:
    url: ${PREVISION_SERVICE_URL:}
  stockage:
    # Profil dev : fichiers exportés sur le disque local.
    local:
      repertoire: ${STOCKAGE_LOCAL_REPERTOIRE:./data/documents}
    # Autres profils : stockage objet compatible S3 / MinIO.
    objet:
      endpoint: ${STOCKAGE_OBJET_ENDPOINT:http://localhost:9000}
      region: ${STOCKAGE_OBJET_REGION:us-east-1}
      bucket: ${STOCKAGE_OBJET_BUCKET:finance-documents}
      access-key: ${STOCKAGE_OBJET_ACCESS_KEY:}
      secret-key: ${STOCKAGE_OBJET_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
