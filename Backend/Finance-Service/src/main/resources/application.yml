spring:
  application:
    name: finance-service
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financial_db}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

finance:
  stockage:
    # Profil dev : fichiers exportés sur le disque local.
    local:
      repertoire: ${STOCKAGE_LOCAL_REPERTOIRE:./data/documents}
    # Autres profils : stockage objet compatible S3 / MinIO.
    objet:
      endpoint: ${STOCKAGE_OBJET_ENDPOINT:http://localhost:9000}
      region: ${STOCKAGE_OBJET_REGION:us-east-1}
      bucket: ${STOCKAGE_OBJET_BUCKET:finance-documents}
      access-key: ${STOCKAGE_OBJET_ACCESS_KEY:}
      secret-key: ${STOCKAGE_OBJET_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
