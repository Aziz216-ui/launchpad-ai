version: "3.9"

services:
  recommandation_db:
    image: postgres:16-alpine
    container_name: recommandation_db
    environment:
      POSTGRES_DB: recommandation_db
      POSTGRES_USER: recommandation_user
      POSTGRES_PASSWORD: recommandation_password
    volumes:
      - recommandation_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommandation_user -d recommandation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  recommandation_service:
    build: .
    container_name: recommandation_service
    depends_on:
      recommandation_db:
        condition: service_healthy
    environment:
      SECRET_KEY: "docker-secret-key-change-in-production"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,recommandation_service"
      DB_NAME: recommandation_db
      DB_USER: recommandation_user
      DB_PASSWORD: recommandation_password
      DB_HOST: recommandation_db
      DB_PORT: "5432"
      EUREKA_SERVER: "http://eureka-server:8761/eureka/"
      APP_NAME: "recommandation-service"
      APP_PORT: "8007"
      HOST_IP: "host.docker.internal"
      PROJET_SERVICE_NAME: "projet-service"
      PROJET_SERVICE_URL: "http://host.docker.internal:8006"
      MARKET_SERVICE_NAME: "market-service"
      MARKET_SERVICE_URL: "http://host.docker.internal:8005"
      LLM_PROVIDER: "openai"
      LLM_API_KEY: ""
      LLM_MODEL: "gpt-4o-mini"
      LLM_BASE_URL: "https://api.openai.com/v1"
    ports:
      - "8007:8007"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_recommandation &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8007 --workers 1 --timeout 120"
    restart: unless-stopped

volumes:
  recommandation_db_data:

