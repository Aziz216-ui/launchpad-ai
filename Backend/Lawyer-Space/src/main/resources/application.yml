server:
  port: 8082

spring:
  application:
    name: lawyer-space
  datasource:
    url: jdbc:postgresql://localhost:5432/launchpad
    username: app_user
    password: '12345678'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
