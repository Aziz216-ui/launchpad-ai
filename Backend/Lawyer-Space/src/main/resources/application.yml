server:
  port: 8082

spring:
  application:
    name: lawyer-space
  datasource:
    url: jdbc:postgresql://localhost:5432/launchpad
    username: app_user
    password: '12345678'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: lawyer-space
    description: Espace Avocat microservice for LaunchPad AI
    version: 1.0.0-SNAPSHOT

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    status-page-url-path: /swagger-ui.html
    home-page-url-path: /swagger-ui.html
    health-check-url-path: /actuator/health


