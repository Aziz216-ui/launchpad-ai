# Port hôte de commentaire-postgres surchargeable via COMMENTAIRE_DB_PORT (défaut 5448,
# déplacé de 5434 pour ne pas entrer en collision avec le défaut de Finance/Document-Service).
services:
  commentaire-postgres:
    image: postgres:16-alpine
    container_name: launchpad-commentaire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: commentaire_db
    ports:
      - "${COMMENTAIRE_DB_PORT:-5448}:5432"
    volumes:
      - commentaire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commentaire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  commentaire-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: launchpad-commentaire-service
    restart: unless-stopped
    depends_on:
      commentaire-postgres:
        condition: service_healthy
    environment:
      PORT: 3005
      NODE_ENV: production
      GLOBAL_PREFIX: api/commentaires
      DB_HOST: commentaire-postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: commentaire_db
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      EUREKA_ENABLED: "true"
      EUREKA_HOST: host.docker.internal
      EUREKA_PORT: 8761
      EUREKA_APP_NAME: COMMENTAIRE-SERVICE
      RABBITMQ_ENABLED: \"true\"
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672
      RABBITMQ_EXCHANGE: launchpad.events
    ports:
      - "3005:3005"

volumes:
  commentaire_pgdata:
    driver: local
