[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-commun"
version = "1.0.0"
description = "Code technique partagé par les microservices de l'étude de marché LaunchPad AI (Eureka, client REST, RabbitMQ, réglages Django)."
requires-python = ">=3.11"
# Aucune dépendance déclarée ici : Django, DRF, drf-spectacular, python-dotenv, requests, pika et
# py-eureka-client sont installés par le requirements.txt de chaque service (versions + hashes).
dependencies = []

[tool.setuptools.packages.find]
include = ["market_commun*"]
