[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "market-commun"
version = "1.0.0"
description = "Code technique partagé par les microservices de l'étude de marché LaunchPad AI (Eureka, client REST, RabbitMQ, réglages Django)."
requires-python = ">=3.11"
# Versions exactes dans le requirements.txt de chaque service (installé avec --no-deps)
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework",
    "drf-spectacular",
    "python-dotenv",
    "requests",
    "pika",
    "py-eureka-client",
]

[tool.setuptools.packages.find]
include = ["market_commun*"]
